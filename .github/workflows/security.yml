name: Security Gate

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

jobs:
  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: sarif
          output: artifacts/trivy-fs.sarif
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: trivy-filesystem-report
          path: artifacts/trivy-fs.sarif

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - run: mkdir -p artifacts
      - run: npx --yes cyclonedx-npm --output-file artifacts/sbom.json --output-format json
      - uses: actions/upload-artifact@v6
        with:
          name: sbom
          path: artifacts/sbom.json

  container:
    name: Container Scan
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: secure-cicd-platform:ci
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: secure-cicd-platform:ci
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: '1'

  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: [container]
    steps:
      - uses: actions/checkout@v6
      - run: |
          export JWT_SECRET='ci-only-jwt-secret-with-more-than-32-chars'
          docker compose up -d --build
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/health && break; sleep 2; done
      - name: ZAP baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://127.0.0.1:3000'
          fail_action: true
          allow_issue_writing: false
      - if: always()
        run: docker compose down -v

  policy:
    name: Security Policy Checks
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6
      - name: Verify no live secrets in tracked configuration
        shell: bash
        run: |
          if grep -RInE 'AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{20,}' --exclude-dir=.git .; then
            echo 'Potential credential material found.'
            exit 1
          fi
          echo 'No known live-credential patterns found.'
