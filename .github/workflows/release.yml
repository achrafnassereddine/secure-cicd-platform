name: Release Image

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3.11.1
      - uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/secure-cicd-platform:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/secure-cicd-platform:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0
      - name: Sign container image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/secure-cicd-platform@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
